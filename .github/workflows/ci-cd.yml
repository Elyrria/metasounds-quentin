name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ARTIFACT_LOCATION: europe-west1
  ARTIFACT_REPO_ID: metasounds-billy
  GCP_PROJECT_ID: cs-poc-hpzdycpiqjyvinhrczvlwcn
  IMAGE_NAME: metasounds
  CONTAINER_NAME: metasounds

jobs:
  # CI : vérifie que l'image se construit et que l'appli répond
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t metasounds:test .

      - name: Smoke test
        run: |
          docker run -d -p 8080:8080 --name smoke metasounds:test
          for i in $(seq 1 10); do
            curl -sf localhost:8080/ && break
            sleep 1
          done
          curl -sf localhost:8080/ | grep -q "Welcome"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/stream)" = "200"

      - name: Logs du conteneur en cas d'échec
        if: failure()
        run: docker logs smoke

      # Rapport complet, pour information (ne bloque pas)
      - name: Scan Trivy (rapport)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: metasounds:test
          format: table
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'

      # Bloque le pipeline s'il reste des failles HIGH/CRITICAL corrigeables
      - name: Scan Trivy (bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: metasounds:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  # CD : push sur Artifact Registry puis déploiement sur la VM (uniquement sur main)
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nom complet de l'image
        run: echo "IMAGE=$ARTIFACT_LOCATION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPO_ID/$IMAGE_NAME:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Authentification GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build et push sur Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_LOCATION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Déploiement sur la VM
        run: |
          TOKEN=$(gcloud auth print-access-token)
          gcloud compute ssh "${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_NAME }}" \
            --zone "${{ secrets.GCP_VM_ZONE }}" \
            --quiet \
            --command "
              set -e
              echo '$TOKEN' | docker login -u oauth2accesstoken --password-stdin https://${{ env.ARTIFACT_LOCATION }}-docker.pkg.dev
              docker pull $IMAGE
              docker rm -f ${{ env.CONTAINER_NAME }} || true
              docker run -d --restart unless-stopped -p 8080:8080 --name ${{ env.CONTAINER_NAME }} $IMAGE
              docker image prune -f
            "

      - name: Vérification
        run: |
          for i in $(seq 1 10); do
            curl -sf "http://${{ secrets.GCP_VM_IP }}:8080/" && exit 0
            sleep 3
          done
          echo "L'appli ne répond pas sur http://<GCP_VM_IP>:8080 (pare-feu GCP ?)"
          exit 1
