name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: europe-west1-docker.pkg.dev
  IMAGE: europe-west1-docker.pkg.dev/cs-poc-hpzdycpiqjyvinhrczvlwcn/metasounds-quentin/metasounds
  CONTAINER_NAME: metasounds

jobs:
  # CI : vérifie que l'image se construit et que l'appli répond
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image
        run: docker build -t metasounds:test .

      - name: Smoke test
        run: |
          docker run -d -p 8080:8080 --name smoke metasounds:test
          for i in $(seq 1 10); do
            curl -sf localhost:8080/ && break
            sleep 1
          done
          curl -sf localhost:8080/ | grep -q "Welcome"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/stream)" = "200"

      - name: Logs du conteneur en cas d'échec
        if: failure()
        run: docker logs smoke

  # CD 1 : push de l'image sur Artifact Registry (uniquement sur main)
  build-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - uses: docker/setup-buildx-action@v3

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # CD 2 : déploiement sur la VM via SSH
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Configuration SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Déploiement
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << EOF
            set -e
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            docker rm -f ${{ env.CONTAINER_NAME }} || true
            docker run -d --restart unless-stopped -p 8080:8080 \
              --name ${{ env.CONTAINER_NAME }} ${{ env.IMAGE }}:${{ github.sha }}
            docker image prune -f
          EOF

      - name: Vérification
        run: |
          sleep 3
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "curl -sf localhost:8080/"
